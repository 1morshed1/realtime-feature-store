# Full local stack for the feature store. Brings up the infrastructure (Kafka, Redis,
# Postgres, Prometheus) and the four services (registry, streamproc, serving, monitor).
#
#   make up      # docker compose -f deploy/docker-compose.yml up -d
#   make down
#
# The services share one image built from ../Dockerfile and select their binary via
# `command`. This file is the executable version of the architecture diagram in the README.

name: feature-store

services:
  # --- infrastructure ----------------------------------------------------------------

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fs
      POSTGRES_PASSWORD: fs
      POSTGRES_DB: featurestore
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka in KRaft mode (no ZooKeeper) — single-node broker for local dev.
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # --- feature store services --------------------------------------------------------

  registry:
    build: ..
    command: ["/usr/local/bin/registry"]
    environment:
      REGISTRY_ADDR: ":8081"
      DATABASE_URL: "postgres://fs:fs@postgres:5432/featurestore?sslmode=disable"
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}

  streamproc:
    build: ..
    command: ["/usr/local/bin/streamproc"]
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "raw-events"
      REDIS_ADDR: "redis:6379"
      OFFLINE_PATH: "/data/offline"
    volumes:
      - offline-data:/data/offline
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_started}

  serving:
    build: ..
    command: ["/usr/local/bin/serving"]
    environment:
      SERVING_ADDR: ":8082"
      REDIS_ADDR: "redis:6379"
      DATABASE_URL: "postgres://fs:fs@postgres:5432/featurestore?sslmode=disable"
    ports: ["8082:8082"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  monitor:
    build: ..
    command: ["/usr/local/bin/monitor"]
    environment:
      MONITOR_ADDR: ":8084"
      REDIS_ADDR: "redis:6379"
      OFFLINE_PATH: "/data/offline"
      MONITOR_ENTITY: "user_id"
      MONITOR_IDS: "u1,u2"
      MONITOR_FEATURES: "txn_count_1h,txn_avg_7d,txn_total_24h"
      MONITOR_INTERVAL: "30s"
    ports: ["8084:8084"]
    volumes:
      - offline-data:/data/offline
    depends_on:
      redis: {condition: service_healthy}

volumes:
  offline-data:
